name: Automated dev builds

on:
  workflow_dispatch:
  push:
    branches:
      - 'ver/**'
      - 'feat/**'

jobs:
  fabric:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Fabric
        run: ./gradlew -p fabric build

      - name: Publish FABRIC artifacts
        env:
          WEBHOOK: ${{ secrets.DEV_BUILDS }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail
          jar=$(ls fabric/build/libs/*.jar | grep -vE -- '-(sources|dev|javadoc)[.]jar$' | head -1)
          test -n "$jar" || { echo "no jar in fabric/build/libs"; exit 1; }
          echo "uploading $jar ($(du -h "$jar" | cut -f1))"
          payload=$(jq -nc \
            --arg u 'FABRIC builds' \
            --arg a 'https://wiki.tf2classic.com/w/images/b/b3/Engineer_BLU.png' \
            --arg repo "$REPO" \
            --arg run "$RUN_NUMBER" \
            --arg m "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            '{username: $u, avatar_url: $a, content: ("<:new1:1253371736510959636><:new2:1253371805734015006> New `\($repo)` dev build `#\($run)`:\n> :sparkles: [\($m)](<\($url)>)")}')
          curl -sS --fail-with-body -X POST "$WEBHOOK" -F "payload_json=$payload" -F "files[0]=@$jar"
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Restore DataGen cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: forge/src/generated
          key: datagen-${{ github.run_id }}
          restore-keys:
            datagen-

      - name: Run DataGen
        run: ./gradlew -p forge Data
        continue-on-error: true

      - name: Save DataGen cache
        uses: actions/cache/save@v4
        with:
          path: forge/src/generated
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Build Forge
        run: ./gradlew -p forge build

      - name: Publish FORGE artifacts
        env:
          WEBHOOK: ${{ secrets.DEV_BUILDS }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail
          jar=$(ls forge/build/libs/*.jar | grep -vE -- '-(sources|dev|javadoc)[.]jar$' | head -1)
          test -n "$jar" || { echo "no jar in forge/build/libs"; exit 1; }
          echo "uploading $jar ($(du -h "$jar" | cut -f1))"
          payload=$(jq -nc \
            --arg u 'FORGE builds' \
            --arg a 'https://wiki.tf2classic.com/w/images/b/b3/Engineer_RED.png' \
            --arg repo "$REPO" \
            --arg run "$RUN_NUMBER" \
            --arg m "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            '{username: $u, avatar_url: $a, content: ("<:new1:1253371736510959636><:new2:1253371805734015006> New `\($repo)` dev build `#\($run)`:\n> :sparkles: [\($m)](<\($url)>)")}')
          curl -sS --fail-with-body -X POST "$WEBHOOK" -F "payload_json=$payload" -F "files[0]=@$jar"
