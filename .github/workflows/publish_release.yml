name: Publish (Modrinth + CurseForge)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Upload nothing, just prove the build and config'
        type: boolean
        default: false

jobs:
  publish:
    uses: duzos/mod-ci/.github/workflows/publish.yml@v1
    secrets: inherit
    with:
      targets: '[{"project":"fabric"},{"project":"forge","datagen":true}]'
      java: '21'
      task: 'publishMods'
      dry_run: ${{ inputs.dry_run || false }}
