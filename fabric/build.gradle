plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}
dependencies {
    // Minecraft ${minecraft_version} ships unobfuscated; no mappings artifact exists or is needed,
    // and mods no longer need the mod* remapping variants
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation(project(":common")) {
        // the platform-specific common-networking variant below supersedes the common one
        exclude group: "mysticdrew", module: "common-networking-common"
    }
    include(implementation("mysticdrew:common-networking-fabric:${project.common_network_version}"))
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client (Alice)")
            programArgs '--username', 'Alice'
            ideConfigGenerated(true)
            runDir("run")
        }
        client2 {
            client()
            setConfigName("Fabric Client (Bob)")
            programArgs '--username', 'Bob'
            ideConfigGenerated(true)
            runDir("run/client2")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
        }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = providers.fileContents(rootProject.layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    // Driven by the shared publish workflow. When true nothing is uploaded and
    // the release assets are written to the build directory instead.
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").map { it == "true" }.getOrElse(false)
    version = "${project.version}-${minecraft_version}-fabric"
    displayName = "Fake Players ${project.version} (${minecraft_version} Fabric)"
    modLoaders.add("fabric")

    def mcVersions = project.publish_game_versions.split(",").collect { it.trim() }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "1RSY6DQH"
        minecraftVersions.addAll(mcVersions)
    }
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "845992"
        projectSlug = "fake-player"
        minecraftVersions.addAll(mcVersions)
        clientRequired = true
        serverRequired = true
    }
    discord {
        webhookUrl = providers.environmentVariable("DISCORD_WEBHOOK")
        username = "Fake Players"
        content = "**Fake Players ${project.version}** released for Minecraft ${minecraft_version} (Fabric)"
    }
}
