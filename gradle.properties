# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.3.0
group=dev.duzo.players
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Fake Players
mod_author=duzo
mod_id=players
license=LGPL-3.0-only
credits=
description=Adds fake player entities with auto-updating skins and item functionality.
minecraft_version_range=[26.1, 26.2)
# Fabric uses semver-style load constraints; keep in sync with minecraft_version_range and publish_game_versions
minecraft_version_range_fabric=>=26.1 <26.2
# Parchment has no 26.x release yet - do not pin the stale 1.21.11 mapping here, it won't match 26.1's obfuscation map

# Fabric
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5

# NeoForge
neoforge_version=26.1.2.109
neoforge_loader_version_range=[1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Dependencies
common_network_version=1.0.23-26.1.2

# Publishing - comma-separated Minecraft versions this jar is tagged for on Modrinth/CurseForge
publish_game_versions=26.1,26.1.1,26.1.2
