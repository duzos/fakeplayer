plugins {
    id 'java-library'
    id 'fabric-loom'
}

// Dev-only: a localhost remote-control client for play-tests. Standalone on purpose; it does not use the
// multiloader plugins and nothing in common/fabric/forge depends on it, so it never ships in a release jar.
base {
    archivesName = "fppilot-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepositories(
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                },
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/fppilot.accesswidener")
    runs {
        client {
            client()
            setConfigName("Fabric Client (devpilot)")
            ideConfigGenerated(false)
            runDir("run/devpilot")
        }
    }
}

processResources {
    var props = [
            version                       : project.version,
            license                       : license,
            minecraft_version_range_fabric: minecraft_version_range_fabric
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand props
    }
}
